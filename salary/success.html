<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Success — Rekap Mengajar SIAQ</title>

    <!-- CSS -->
    <link rel="stylesheet" href="salary.css" />
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="salary-header">
            <button class="btn-back" id="btnBack" aria-label="Kembali">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"/>
                    <path d="m12 19-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="salary-header-title" id="pageTitle">SUCCESS</h1>
            <!-- Tombol print — hanya aktif di pending -->
            <button class="btn-print" id="btnPrint" aria-label="Cetak">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 9V2h12v7"/>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
                    <rect x="6" y="14" width="12" height="8"/>
                </svg>
            </button>
        </div>

        <!-- ===== ERROR BOX ===== -->
        <div id="errorBox"></div>

        <!-- ===== VIEW HOME: 2 CARD ===== -->
        <div id="viewHome">
            <div class="card-grid">

                <div class="salary-card" id="cardClasses">
                    <div class="salary-card-title">Classes</div>
                    <div class="salary-card-desc">Lihat detail kelas</div>
                </div>

                <div class="salary-card" id="cardClub">
                    <div class="salary-card-title">Club</div>
                    <div class="salary-card-desc">Lihat detail club</div>
                </div>

            </div>
        </div>

        <!-- ===== VIEW TABLE ===== -->
        <div id="viewTable" style="display:none;">

            <div class="table-header-bar">
                <div class="table-header-title">
                    <span id="tableTitle">Classes</span>
                    <span class="table-count" id="tableCount"></span>
                </div>
                <div class="total-badge" id="tableTotal">Rp0K</div>
            </div>

            <div class="table-wrap">
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Tanggal</th>
                                <th>Hari</th>
                                <th>Kelas</th>
                                <th style="text-align:center;width:40px;"></th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="4" style="text-align:center;padding:30px 0;color:#6f84a0;">
                                    Memuat data …
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

        <div class="footer-credit">created by Azhibnmjkfr</div>
    </div>

    <!-- ===== MODAL DETAIL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <button class="modal-close" id="modalClose" aria-label="Tutup">&#10005;</button>
            <div class="modal-title">Detail</div>
            <div>
                <div class="modal-item">
                    <span class="modal-label">Tanggal</span>
                    <span class="modal-value" id="modalTanggal">-</span>
                </div>
                <div class="modal-item">
                    <span class="modal-label">Hari</span>
                    <span class="modal-value" id="modalHari">-</span>
                </div>
                <div class="modal-item">
                    <span class="modal-label">Kelas</span>
                    <span class="modal-value" id="modalKelas">-</span>
                </div>
                <div class="modal-item">
                    <span class="modal-label">JP</span>
                    <span class="modal-value" id="modalJp">-</span>
                </div>
                <div class="modal-item">
                    <span class="modal-label">Stat</span>
                    <span class="modal-value" id="modalStat">-</span>
                </div>
                <div class="modal-item">
                    <span class="modal-label">Amount</span>
                    <span class="modal-value" id="modalAmount">-</span>
                </div>
                <div class="modal-item">
                    <span class="modal-label">Total</span>
                    <span class="modal-value" id="modalTotal">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== PRINT AREA (hanya tampil saat print) ===== -->
    <div id="printArea"></div>

    <script src="salary.js"></script>

</body>
</html>
